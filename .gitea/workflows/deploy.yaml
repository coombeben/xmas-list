name: Christmas Lists CI/CD

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ vars.DOCKER_REGISTRY }}"]

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push backend container
        uses: docker/build-push-action@v6
        env:
          IMAGE_TAG: ${{ vars.DOCKER_REGISTRY }}/xmaslist/backend
        with:
          context: ./backend
          tags: ${{ env.IMAGE_TAG }}:latest
          push: true
          output: type=registry
          cache-to: type=registry,mode=max,ref=${{ env.IMAGE_TAG }}:cache
          cache-from: type=registry,ref=${{ env.IMAGE_TAG }}:cache

      - name: Build and push frontend container
        uses: docker/build-push-action@v6
        env:
          IMAGE_TAG: ${{ vars.DOCKER_REGISTRY }}/xmaslist/frontend
        with:
          context: ./frontend
          tags: ${{ env.IMAGE_TAG }}:latest
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          output: type=registry
          cache-to: type=registry,mode=max,ref=${{ env.IMAGE_TAG }}:cache
          cache-from: type=registry,ref=${{ env.IMAGE_TAG }}:cache

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to container registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ vars.DOCKER_REGISTRY }} -u ${{ gitea.actor }} --password-stdin

      - name: Pull latest images
        run: docker compose pull -q

      - name: Deploy with Docker Compose
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FLASK_ENV: production
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Logout from registry
        run: docker logout ${{ vars.DOCKER_REGISTRY }}

      - name: Clean up
        run: docker system prune -f
