name: Christmas Lists CI/CD

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /toolcache
      BACKEND_IMAGE_NAME: flask-app
      FRONTEND_IMAGE_NAME: react-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build -t $FRONTEND_IMAGE_NAME frontend

      - name: Build backend image
        run: |
          docker build -t $BACKEND_IMAGE_NAME backend

      - name: Save built images
        run: |
          docker save $FRONTEND_IMAGE_NAME > frontend.tar
          docker save $BACKEND_IMAGE_NAME > backend.tar

      - name: Upload images as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docker-images
          path: |
            frontend.tar
            backend.tar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      PROJECT_NAME: xmaslist
      BACKEND_IMAGE_NAME: flask-app
      FRONTEND_IMAGE_NAME: react-app
      HOST_DEPLOY_DIR: /home/docker/XmasList
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Download built images
        uses: actions/download-artifact@v3
        with:
          name: docker-images

      - name: Load docker images
        run: |
          docker load < frontend.tar
          docker load < backend.tar

      - name: Copy to host
        run: |
          mkdir -p $HOST_DEPLOY_DIR
          cp docker-compose.yml $HOST_DEPLOY_DIR/     
          
      - name: Deploy services
        run: |
          cd $HOST_DEPLOY_DIR
          docker compose -p $PROJECT_NAME down
          docker compose -p $PROJECT_NAME up -d

      - name: Clean up
        run: |
          docker system prune -f
