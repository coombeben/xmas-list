services:
  frontend:
    image: registry.coombe.xyz/xmaslist/frontend:latest
    build: frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8082:80"
    networks:
      - app-network

  backend:
    image: registry.coombe.xyz/xmaslist/backend:latest
    build: backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
      - APP_PASSWORD=${APP_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:5000/api/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  db:
    hostname: db
    image: postgres
    restart: unless-stopped
    user: postgres
    shm_size: 128mb
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", '$$POSTGRES_DB' ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
