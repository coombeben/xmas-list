events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/css text/javascript application/json;

    server {
        listen 80;
        server_name localhost;

        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header X-XSS-Protection "1; mode=block";

        # Serve React static files
        location / {
            root /usr/share/nginx/html;  # This is where the React app build files are located
            try_files $uri /index.html;  # Fallback to index.html for React Router
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate';
        }

        # Reverse proxy API requests to Flask
        location /api/ {
            proxy_pass http://backend:5000;  # Proxy API requests to Flask container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
